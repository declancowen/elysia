name: Release Elysia

on:
  push:
    tags:
      - "v*.*.*"
      - "!v*-*"
      - '!v*\+*'
  workflow_dispatch:
    inputs:
      version:
        description: "New stable version (for example 0.0.1 for the first release)"
        required: true
        type: string
      publish:
        description: "Publish installers and the stable update feed to GitHub Releases"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-elysia-stable
  cancel-in-progress: false
  queue: max

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    name: Resolve stable release
    if: github.repository == 'declancowen/elysia'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      ref: ${{ github.sha }}
    steps:
      - name: Checkout release scripts
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set .github/scripts
          git checkout --detach FETCH_HEAD

      - name: Resolve release version
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        with:
          script: |
            const { resolveElysiaRelease } = require('./.github/scripts/check-elysia-release.cjs');
            const raw = context.eventName === 'workflow_dispatch'
              ? process.env.DISPATCH_VERSION
              : context.ref.replace('refs/tags/', '');
            const { version, tag } = await resolveElysiaRelease({ github, context, raw });
            core.setOutput('version', version);
            core.setOutput('tag', tag);

  build_bundle:
    name: Check and build JS bundle
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ needs.preflight.outputs.ref }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}/pnpm-metadata
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Upload dependency verification
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dependency-verification
          path: ${{ runner.temp }}/pnpm-metadata/lockfile-verified.jsonl
          if-no-files-found: ignore
          retention-days: 1

      - name: Align package versions
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION"

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vp run --concurrency-limit 2 --filter @t3tools/desktop... --filter @t3tools/web... --filter t3... --filter @t3tools/scripts... typecheck

      - name: Test release guards
        run: node --test .github/scripts/check-*-release.test.cjs

      # The upstream CI suite retains multi-provider, connection and mobile
      # coverage. Release regressions run against the shipped Elysia policy.
      - name: Test desktop packaging and release metadata
        run: |
          vp test run --config vite.config.ts \
            scripts/build-desktop-artifact.test.ts \
            scripts/lib/brand-assets.test.ts \
            scripts/update-release-package-versions.test.ts \
            scripts/merge-update-manifests.test.ts

      - name: Test Elysia runtime and credential protection
        run: |
          vp test run --config vite.config.ts \
            apps/server/src/provider/ElysiaCli.test.ts \
            apps/server/src/provider/ElysiaPolicy.test.ts \
            apps/server/src/elysiaConnections.test.ts \
            apps/server/src/provider/ProviderCredentialStore.test.ts \
            apps/server/src/provider/ProviderAuthFlow.test.ts \
            apps/server/src/provider/ElysiaStats.test.ts \
            apps/server/src/auth/RpcAuthorization.test.ts \
            apps/server/src/provider/Drivers/ClaudeSkillDispatch.test.ts

      - name: Test Elysia client and onboarding
        run: |
          vp test run --config vite.config.ts \
            apps/web/src/elysiaModelSelection.test.ts \
            apps/web/src/themePalette.test.ts \
            apps/web/src/themeBoot.test.ts \
            apps/web/src/components/Sidebar.logic.test.ts \
            apps/web/src/rightPanelStore.test.ts \
            apps/web/src/components/chat/ThreadOverviewPanel.test.tsx \
            apps/web/src/components/chat/PanelLayoutControls.test.tsx \
            apps/web/src/components/sidebar/SidebarChrome.test.tsx \
            apps/web/src/components/usage/ElysiaUsagePage.test.tsx \
            apps/web/src/components/uploadedSources.test.ts \
            apps/web/src/components/chat/ModelPickerContent.test.ts \
            apps/web/src/components/chat/modelPickerKeys.test.ts \
            apps/web/src/components/chat/modelPickerSearch.test.ts \
            apps/web/src/components/settings/ProviderSettingsForm.test.ts \
            apps/web/src/components/settings/ProviderSettingsPanel.logic.test.ts \
            apps/web/src/components/settings/ProviderSettingsPanel.environment.test.tsx \
            apps/web/src/components/settings/ElysiaSetupSection.test.tsx \
            apps/web/src/state/desktopUpdate.test.ts \
            apps/web/src/components/desktopUpdate.logic.test.ts \
            apps/web/src/components/sidebar/SidebarUpdatePill.test.tsx
          vp test run --config vite.config.ts \
            apps/web/src/components/settings/settingsSearch.test.ts \
            --testNamePattern 'finds Appearance themes by|finds Send shortcut for'

      - name: Test desktop stable updater and settings
        run: |
          vp test run --config vite.config.ts \
            apps/desktop/src/settings/DesktopAppSettings.test.ts \
            apps/desktop/src/settings/DesktopClientSettings.test.ts \
            apps/desktop/src/updates/updateChannels.test.ts \
            apps/desktop/src/updates/updateMachine.test.ts \
            apps/desktop/src/updates/releaseNotes.test.ts \
            apps/desktop/src/updates/ElysiaUpdates.test.ts \
            apps/desktop/src/updates/DesktopUpdates.test.ts \
            apps/desktop/src/electron/ElectronUpdater.test.ts

      - name: Test persistent agents and context continuity
        run: |
          vp test run --config vite.config.ts \
            packages/contracts/src/agentProfile.test.ts \
            packages/shared/src/agentAvatar.test.ts \
            apps/server/src/orchestration/PersistentAgents.test.ts \
            apps/server/src/provider/ElysiaAgentProtection.test.ts \
            apps/server/src/provider/RuntimeInstructions.test.ts \
            apps/server/src/provider/Layers/ProviderService.test.ts \
            apps/server/src/provider/Layers/ClaudeAdapter.test.ts \
            apps/server/src/orchestration/Layers/CheckpointReactor.test.ts \
            apps/web/src/agentPresentation.test.ts \
            apps/web/src/components/agents/agentProfileSave.test.ts \
            apps/web/src/components/agents/agentDialogStore.test.ts \
            apps/web/src/components/agents/AgentEditorPage.test.tsx \
            apps/web/src/components/agents/AgentControls.test.tsx \
            apps/web/src/components/agents/AgentAvatarPicker.test.tsx \
            apps/web/src/components/settings/ArchivedAgentsSection.test.tsx \
            apps/web/src/components/chat/ComposerPrimaryActions.agent.test.tsx \
            apps/web/src/components/ThreadNotificationCoordinator.test.tsx \
            apps/web/src/components/ThreadNotificationCoordinator.badge.test.tsx

      - uses: ./.github/actions/setup-apt-mirrors

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run build:desktop

      - name: Upload JS bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: Desktop ${{ matrix.label }}
    needs: [preflight, build_bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
          - label: macOS x64
            runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
            resource_key: darwin-x64
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
          - label: Windows arm64
            runner: windows-11-arm
            platform: win
            target: nsis
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
            resource_key: win32-arm64
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: stable
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      require_macos_signing: true
      macos_passkeys: false
      label: ${{ matrix.label }}
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      rust_target: ${{ matrix.rust_target }}
      resource_key: ${{ matrix.resource_key }}
      with_wsl_runtime: false
      cli_archive: false

  release:
    name: Publish installers and update feed
    needs: [preflight, desktop]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ needs.preflight.outputs.ref }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download desktop artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Merge updater manifests and checksum release assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/merge-update-manifests.ts --platform mac \
            release-assets/latest-mac.yml release-assets/latest-mac-x64.yml
          node scripts/merge-update-manifests.ts --platform win \
            release-assets/latest-win-x64.yml release-assets/latest-win-arm64.yml release-assets/latest.yml
          rm release-assets/latest-mac-x64.yml release-assets/latest-win-x64.yml release-assets/latest-win-arm64.yml
          rm -f release-assets/builder-debug.yml
          cd release-assets
          sha256sum ./* > SHA256SUMS

      - name: Publish stable release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: Elysia v${{ needs.preflight.outputs.version }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/latest.yml
            release-assets/latest-mac.yml
            release-assets/SHA256SUMS
